name: test-and-deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r backend/requirements.txt
      - run: cd backend && python -m pytest -q
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - run: cd app && npm ci && npm run typecheck

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with: { node-version: 22, cache: npm, cache-dependency-path: app/package-lock.json }
      - name: Build web app
        working-directory: app
        env:
          EXPO_PUBLIC_API_URL: https://paisa.auraa-ai.org/api/v1
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.GOOGLE_ANDROID_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ secrets.GOOGLE_IOS_CLIENT_ID }}
        run: npm ci && npx expo export -p web
      - name: SSH setup (host key is pinned, never ssh-keyscan'd)
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.LIGHTSAIL_SSH_KEY }}" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.LIGHTSAIL_HOST_KEY }}" > ~/.ssh/known_hosts
      - name: Upload web build
        run: rsync -az --delete app/dist/ deploy@${{ secrets.LIGHTSAIL_HOST }}:/var/www/paisapilot/web/
      - name: Deploy backend + health check
        run: ssh deploy@${{ secrets.LIGHTSAIL_HOST }} 'sudo /opt/paisapilot/deploy/deploy.sh'
