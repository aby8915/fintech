# /etc/nginx/sites-available/paisapilot  (installed by server-setup.sh after the cert exists)
limit_req_zone $binary_remote_addr zone=paisa_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=paisa_auth:10m rate=2r/s;

server {
    listen 80;
    server_name paisa.auraa-ai.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name paisa.auraa-ai.org;
    ssl_certificate     /etc/letsencrypt/live/paisa.auraa-ai.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/paisa.auraa-ai.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    server_tokens off;
    client_max_body_size 6m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
    # Strict CSP for the web build. 'unsafe-inline' for style is required by react-native-web;
    # scripts are same-origin only plus Google sign-in.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.googleusercontent.com; connect-src 'self' https://accounts.google.com https://oauth2.googleapis.com; frame-src https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    root /var/www/paisapilot/web;
    index index.html;

    location /api/v1/auth/ {
        limit_req zone=paisa_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8100;
        include /etc/nginx/snippets/paisa-proxy.conf;
    }

    location /api/ {
        limit_req zone=paisa_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8100;
        include /etc/nginx/snippets/paisa-proxy.conf;
    }

    location /_expo/ {
        expires 1y;
    }

    location / {
        try_files $uri /index.html;
        expires -1;
    }
}
